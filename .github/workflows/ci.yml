name: CI

# Critical-path gate (audit EV-012). Runs the test suite + a build smoke check
# on every PR to main and on pushes to main. Enable branch protection
# (Settings → Branches → require status checks) so a red run blocks merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Use npm, NOT bun: package-lock.json resolves from public
      # registry.npmjs.org, whereas bun.lock is pinned to a private Lovable
      # Artifact Registry that CI runners can't authenticate to.
      - name: Install dependencies
        run: npm ci

      # --- Hard gates: a failure here blocks the merge ---
      - name: Unit tests
        run: npm test

      - name: Build smoke check
        run: npm run build

      # --- Informational (non-blocking) until the pre-existing findings are
      #     cleared. Promote tsc to a hard gate after fixing the 3 known type
      #     errors (LectureMaterialsUpload.tsx, StudentProgressCard.tsx). ---
      - name: Typecheck (non-blocking)
        run: npx tsc --noEmit -p tsconfig.app.json
        continue-on-error: true

      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

  deno-check:
    name: deno check (shared edge modules, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Scope to the small, pure shared modules added during stabilization.
      # The 33 endpoint files are intentionally not checked here yet.
      - name: Type-check shared edge modules
        run: >-
          deno check
          supabase/functions/_shared/deliveryVerification.ts
          supabase/functions/_shared/joinRateLimit.ts
          supabase/functions/_shared/log.ts
          supabase/functions/_shared/sentry.ts
